<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex flex-col justify-center items-center">
  <div class="nav flex  pt-2 justify-around w-[100vw] bg-green-300 h-[5vh]">

    This is nav bar

    <a class="hover:bg-blue-200 rounded p-1" href="{% url 'signin_view_url' %}">Logout</a>
  </div>
  <div class="h-8 mt-24 ">

    <h1>welcome to home </h1>

  </div>
  {% for user in user_data %}
  <div class="h-24 bg-purple-400  w-[50%] rounded mt-16">

    <div class="h-8 bg-blue-200">

      <ul>
        {{ user.email }}
       

      </ul>
    </div>

    <div class="h-8 bg-gray-300 p-1 ">

      <ul>
        {{ user.name }}

      </ul>
      <ul class="flex justify-around ">

        <form method="POST" action="{% url 'update_url' %}">
          {% csrf_token %}
            <input type="hidden" name="user_id"value="{{ user.id }}"/>
          <button class="p-1 bg-blue-500 rounded" type="submit">update</button>
        </form>
        <form method="POST" action="{% url 'delete_user_url' %}">
          {% csrf_token %}
          <input type="hidden" name="user_id"value="{{ user.id }}"/>
          <button class="p-1 bg-red-500 rounded" type="submit">delete</button>
        </form>
      </ul>
    </div>

  </div>
  {% endfor %}

</body>

</html>
