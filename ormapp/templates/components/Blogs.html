<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blogs</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-100 flex flex-col items-center justify-center">
  <div class="flex    h-[50vh] mt-16 flex-col bg-green-500 rounded w-[50%]  items-center ">
    <div class=" p-5 font-bold">   

      {{ blog.title }} <br>
    
    </div>
    <div class="pl-5">

      {{ blog.caption }}

    </div>
   
    </div>
     <div class="wrapper  flex mt-[5%]  justify-center">

      <a class="bg-blue-500 rounded p-1 m-1" href="{% url 'update_blog_view_url' blog.id %}">update blog</a>
      
      <a class="rounded bg-blue-300 p-2 m-1  " href="{% url 'home_url' %}">Return to main page </a>
      <a class="bg-red-500 rounded p-1 m-1 " href="{% url 'delete_blog_view_url' blog.id %}">Delete blog</a>
  </div>
</body>
</html>
