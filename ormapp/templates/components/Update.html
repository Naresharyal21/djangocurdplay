<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>update blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100 flex flex-col items-center justify-center">
  <div class="flex  mt-16 pb-8 flex-col bg-red-100 rounded w-[50%]  items-center ">
    <div class="pl-5">

      <p class="font-bold text-red-500 mt-4">updating current blog!</p>

    </div>
    <div class=" p-5 font-bold">

     Title: {{ blog.title }} <br>
      

    </div>
   <form action="{% url 'update_post_url' blog.id %}" method="POST">
      {% csrf_token %}
       <input class= "h-8 mt-8  p-1 w-[100%] bg-blue-200 rounded " type="text" name="title" value="{{ blog.title }}"
          >
      <textarea class="h-16 mt-8  p-1 w-[100%]" type="text"row="5" name="updateblog">{{ blog.caption}}</textarea>

      <button type="submit" class="justify-between bg-red-400 rounded  mt-2 ml-[25%] p-1"> Yes update</button>
    </form>
  </div>
  <div class="wrapper flex items-center justify-center mt-8">

    <a class="rounded bg-blue-200 p-2  " href="{% url 'home_url' %}">Return </a>

 
  </div>
</body>

</html>
